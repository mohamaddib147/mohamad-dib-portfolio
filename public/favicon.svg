<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <!-- Background circle -->
  <circle cx="18" cy="18" r="18" fill="#081120"/>

  <!-- Signal arcs (radiating from top-right) -->
